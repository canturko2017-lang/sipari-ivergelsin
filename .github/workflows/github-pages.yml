name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  package:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - name: Dosyaları al
        uses: actions/checkout@v4
      - name: Pages ayarlarını hazırla
        uses: actions/configure-pages@v5
      - name: Oyun dosyalarını hazırla
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: package
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Yayın paketinin görünmesini bekle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            ready=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              --jq '.artifacts | any(.name == "github-pages" and .expired == false)') || ready=false
            if [ "$ready" = true ]; then exit 0; fi
            sleep 3
          done
          echo 'Yayın paketi henüz bulunamadı.' >&2
          exit 1
      - name: Siteyi yayınla
        id: deployment
        uses: actions/deploy-pages@v4
